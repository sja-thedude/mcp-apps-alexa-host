name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser end-to-end
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/ >/dev/null && break; sleep 1; done
          npm run e2e -- http://localhost:8787
